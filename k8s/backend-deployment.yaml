apiVersion: apps/v1
kind: Deployment
metadata:
  name: autodevops-backend
  labels:
    app: autodevops
    component: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: autodevops
      component: backend
  template:
    metadata:
      labels:
        app: autodevops
        component: backend
    spec:
      containers:
        - name: backend
          image: autodevops-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: autodevops-config
            - secretRef:
                name: autodevops-secrets
                optional: true
          resources:
            limits:
              cpu: "1"
              memory: "1Gi"
            requests:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /api/status
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /api/status
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: autodevops-backend
  labels:
    app: autodevops
    component: backend
spec:
  selector:
    app: autodevops
    component: backend
  ports:
    - port: 8000
      targetPort: 8000
      protocol: TCP
      name: http
  type: ClusterIP
